name: Reference verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify arithmetic and committed LUTs
        run: |
          python python/verify_phase_ring.py
          python python/generate_lut.py --check
      - name: Run Python and RTL tests
        run: pytest
      - name: Compare actual RTL indices and LUT words with Python
        run: python python/compare_rtl_reference.py
      - name: Run examples
        run: |
          python examples/basic_phase_addition.py
          python examples/image_lut_example.py
